name: Release

# Tag-triggered release. Push a tag like `v0.1.0-beta.1` to publish:
#   - a container image to GHCR (ghcr.io/<owner>/lightview), semver-pinned
#   - a GitHub Release with the compose file attached
#
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# The moving `:beta` / `:release` / `:latest` channel tags are NOT set here —
# container.yml owns those, off ordinary branch pushes.
#
# **There is no binary artifact, and that is a decision rather than an
# omission.** There are two deployments: this image, and an Arch package built
# from source by the person running it (see PKGBUILD). Nothing downloads a loose
# Linux tarball, so building and publishing one was CI time spent on an artifact
# with no consumer. The desktop installers went with Tauri, and the separate
# worker binary went with the distributed tagging queue — `lightview tag` runs
# on the machine that has the GPU, from the same package.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the release
  packages: write   # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release + attach compose file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LightView ${{ github.ref_name }}"
          prerelease: true
          body: |
            **Beta / pre-release.** Two ways to run LightView:

            - **Serve a gallery over the LAN** —
              `ghcr.io/${{ github.repository_owner }}/lightview:${{ github.ref_name }}`.
              The attached `docker-compose.yml` runs it; swap `build: .` for the
              image reference above.
            - **Open a gallery locally** — build the Arch package from this tag
              (`makepkg -si` against the `PKGBUILD`), then `lightview <folder>`.
              The same package carries `lightview tag` for running plugins.
          files: docker-compose.yml

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lightview
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}

      - name: Short commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Stamps the SPA's Settings → About with the source commit.
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

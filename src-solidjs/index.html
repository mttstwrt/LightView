<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 + user-scalable=no disables browser zoom entirely: no
         pinch-to-zoom and, crucially on iOS, no auto-zoom when focusing an input
         (Safari zooms on focus unless it's already pinned at scale 1). All
         zooming in LightView is handled by the grid/viewer, never the browser.

         viewport-fit=cover lets the layout viewport extend edge-to-edge under
         the iOS notch / dynamic island instead of being letterboxed into the
         safe area (which paints as a black bar). The grid then scrolls under
         the island; floating chrome pads itself with env(safe-area-inset-*).

         interactive-widget=resizes-content makes Android Chrome shrink the
         layout viewport when the software keyboard opens, so bottom-anchored
         chrome (the mobile filter sheet) lands above the keyboard instead of
         behind it. iOS ignores this; there the sheet tracks visualViewport in
         JS (TopBar) to stay visible. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LightView</title>
    <!-- PWA: installable, standalone chrome on phones. The manifest and icons
         live in public/ (served from the web root); the service worker is
         registered in index.tsx, web client only. theme-color keeps the iOS
         status bar / Android task switcher matched to the app background. -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LightView" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

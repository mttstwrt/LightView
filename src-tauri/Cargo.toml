[package]
name = "lightview"
version = "0.1.0"
edition = "2024"
description = "A fast, plugin-extensible media gallery"

[lib]
name = "lightview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
image = "0.25"
sha2 = "0.10"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
notify = "6"
walkdir = "2"
bytes = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures = "0.3"
fast_image_resize = "6"
jpeg-decoder = "0.3"
memmap2 = "0.9"
percent-encoding = "2"
trash = "5"
bytemuck = { version = "1", features = ["derive"] }
libheif-rs = "2"
kamadak-exif = "0.6"
thumbhash = "0.1"
webp = "0.3"
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
http-range = "0.1.5"
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"
x11rb = "0.13"

# Optimize dependencies even in dev builds — image codecs, SIMD resize,
# and SQLite are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

[features]
default = ["custom-protocol", "gpu"]
custom-protocol = ["tauri/custom-protocol"]
gpu = ["dep:wgpu", "dep:pollster"]
# Legacy alias
gpu-resize = ["gpu"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "thumbnailer"
harness = false

[[bench]]
name = "cache_db"
harness = false

[profile.release]
incremental = false # Disable incremental builds for a "cleaner" optimization
opt-level = 3       # Maximize speed (default for release, but good to be explicit)
lto = "thin"        # Link Time Optimization (massively improves cross-crate speed)
codegen-units = 1   # Reduces parallel compilation to allow deeper optimization
panic = "abort"     # Removes stack unwinding code, making the binary smaller and faster
strip = true        # Removes symbols to shrink the file size

# Benchmark profile — inherits release optimizations but keeps symbols for flamegraphs.
# Cargo forces panic=unwind for bench profiles (Criterion requires it).
[profile.bench]
inherits = "release"
strip = false       # Keep symbols for flamegraph profiling
debug = true        # DWARF info for flamegraphs

# LightView headless gallery server.
#
#   1. Point the gallery bind mount below at your photo/video folder.
#   2. docker compose up -d --build
#   3. Pair a device (mints a one-time PIN):
#        docker compose exec lightview \
#          /opt/lightview/lightview-headless pair /gallery
#      then open https://<host>:8787/pair on the device and enter the PIN.
#
# The server is HTTPS with a self-signed cert, so the browser will warn once —
# that's expected (a secure context is required for clipboard/upload APIs).
#
# IMPORTANT: set LIGHTVIEW_TLS_SAN below to this host's LAN IP (or DNS name).
# The container can only detect its own bridge address (172.x.y.z), so without
# it the cert never covers the address your devices actually dial and every
# client fails hostname verification. Desktop browsers survive that on a
# click-through exception, but iOS drops the exception readily and a
# home-screen PWA can't display the prompt to re-accept it — the app then opens
# from its cached shell and silently loads no thumbnails or full images.

services:
  lightview:
    build:
      context: .
      # Optional: stamp the built SPA with the source commit so Settings → About
      # shows it. Supply via env, e.g.:
      #   GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
      # Unset, the per-build timestamp still distinguishes rebuilds.
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: lightview-headless
    container_name: lightview
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Your media folder. Read-write: uploads land here and the gallery's
      # .lightview/cache.db (thumbnails, tags, device pairings) lives inside it.
      - ./photos:/gallery
      # Persists the self-signed TLS cert + any server-side plugins across
      # rebuilds (data/ is resolved next to the binary at /opt/lightview).
      - lightview-data:/opt/lightview/data
    environment:
      - RUST_LOG=info
      # Addresses the TLS cert must cover, beyond loopback and the container's
      # own (useless) bridge IP. Set this to the LAN IP or DNS name devices use
      # to reach this host; comma-separate to list several. Changing it re-mints
      # the cert, so every browser shows the trust prompt once more.
      #   - LIGHTVIEW_TLS_SAN=192.168.1.2,gallery.lan
      - LIGHTVIEW_TLS_SAN=${LIGHTVIEW_TLS_SAN:-}
    # To change the port, update BOTH the mapping above and this command's port.
    command: ["serve", "/gallery", "--port", "8787"]
    # The SSE change-stream holds connections open; without this, `down` waits
    # the full 10s SIGTERM timeout before killing the container.
    stop_grace_period: 3s

volumes:
  lightview-data:

[package]
name = "lightview"
version = "0.1.0"
edition = "2024"
description = "A fast, plugin-extensible media gallery"

[lib]
name = "lightview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
image = "0.25"
sha2 = "0.10"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
notify = "6"
walkdir = "2"
bytes = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures = "0.3"
fast_image_resize = "6"
jpeg-decoder = "0.3"
memmap2 = "0.9"
percent-encoding = "2"
bytemuck = { version = "1", features = ["derive"] }
libheif-rs = "2"
kamadak-exif = "0.6"
# Offline reverse geocoding (GeoNames cities1000, ~7.9 MB embedded in the
# binary). Replaces a gazetteer download, a CSV parser, and a k-d tree we would
# otherwise maintain ourselves; see src/geocode.
reverse_geocoder = "4.1.1"
thumbhash = "0.1"
webp = "0.3"
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
http-range = "0.1.5"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rcgen = "0.13"
time = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
# The built SPA, compiled into the binary so a deployment is one file (see
# http_server::web_assets). `mime-guess` supplies the Content-Type; in debug
# builds rust-embed reads dist/ from disk instead, so `npm run build` still
# takes effect without a recompile.
rust-embed = { version = "8", features = ["mime-guess"] }
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5"
rand = "0.8"
# HTTP client for the lightview-worker binary only (feature `worker`); rustls
# 0.23 above keeps the TLS stack version-aligned for cert pinning.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"
x11rb = "0.13"

# Optimize dependencies even in dev builds — image codecs, SIMD resize,
# and SQLite are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

[features]
default = ["custom-protocol", "gpu"]
custom-protocol = ["tauri/custom-protocol"]
gpu = ["dep:wgpu", "dep:pollster"]
# Remote tagging worker (docs/workerTagging.md). Feature-gated so the desktop
# and headless builds never pull in an HTTP client.
worker = ["dep:reqwest"]

# The tagging worker: runs plugins on a capable machine against a remote
# headless server. Explicit [[bin]] because required-features can't be set on
# auto-discovered binaries; lightview-headless stays auto-discovered.
[[bin]]
name = "lightview-worker"
path = "src/bin/lightview-worker/main.rs"
required-features = ["worker"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "thumbnailer"
harness = false

[[bench]]
name = "cache_db"
harness = false

[profile.release]
incremental = false # Disable incremental builds for a "cleaner" optimization
opt-level = 3       # Maximize speed (default for release, but good to be explicit)
lto = "thin"        # Link Time Optimization (massively improves cross-crate speed)
codegen-units = 1   # Reduces parallel compilation to allow deeper optimization
panic = "abort"     # Removes stack unwinding code, making the binary smaller and faster
strip = true        # Removes symbols to shrink the file size

# Benchmark profile — inherits release optimizations but keeps symbols for flamegraphs.
# Cargo forces panic=unwind for bench profiles (Criterion requires it).
[profile.bench]
inherits = "release"
strip = false       # Keep symbols for flamegraph profiling
debug = true        # DWARF info for flamegraphs

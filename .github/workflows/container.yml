name: Container

# Push-triggered container images → GHCR (ghcr.io/<owner>/lightview).
#
#   any branch push        → :beta        (+ :<branch>, :sha-<short>)
#   push to default branch → :release     (+ :latest, :<branch>, :sha-<short>)
#
# Channels are keyed on the repo's *default* branch rather than a hardcoded
# name, so `main` → `master` (or vice versa) needs no edit here.
#
# Tag pushes (`v*`) are deliberately NOT handled here — the `branches` filter
# below excludes them, and release.yml owns tagged builds (semver-pinned image
# + desktop installers + GitHub Release).
#
# Heads up: the Dockerfile does `COPY . .` before `npm ci` and `cargo build
# --release`, so any source change busts the dependency layers and every push
# pays a full Rust release build. The GHA layer cache below only spares the
# pacman base layer. If this gets painful, the fix is cache mounts in the
# Dockerfile (`RUN --mount=type=cache` over the cargo registry + target dir).

on:
  push:
    branches:
      - "**"

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lightview
          tags: |
            type=raw,value=release,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=ref,event=branch
            type=sha,format=short

      - name: Short commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Stamps the SPA's Settings → About with the source commit.
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
